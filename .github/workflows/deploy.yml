name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 에 Pages 배포 권한을 준다. 그 외는 읽기만.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 되므로 진행 중인 것을 취소하지 않고 큐에 세운다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 은 Node 20 이상을 요구한다.
          node-version: '22'
          cache: npm

      - run: npm ci

      # 프로젝트 페이지는 https://<user>.github.io/<repo>/ 로 서빙되므로
      # 저장소 이름을 base 로 넣어야 에셋 경로가 맞는다.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
